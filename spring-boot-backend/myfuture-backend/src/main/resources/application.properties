spring.application.name=myfuture-backend

# MongoDB configuration (single instance, no replica set)
# spring.data.mongodb.uri=mongodb://localhost:27017/myfuture_lsmsdb_2025
# MongoDB configuration for Replica Set -> list all nodes and add the parameter replicaSet=rs0.
spring.data.mongodb.uri=mongodb://localhost:27017,localhost:27018,localhost:27019/myfuture_lsmsdb_2025?replicaSet=rs0
spring.data.mongodb.database=myfuture_lsmsdb_2025

logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO
logging.level.org.springdoc=DEBUG
logging.level.io.swagger.v3.oas=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Force the address for documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# If you are using a port other than 8080, specify it here.
server.port=8080